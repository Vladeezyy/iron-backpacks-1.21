plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 26.x: no obfuscation, no mappings, plain configurations (no mod* ones)
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

loom {
    runs {
        client {
            client()
            runDir('run')
        }
        server {
            server()
            runDir('run')
        }
        // headless GameTests: run them, write the report and stop (fabric-api gametest)
        gametest {
            server()
            name 'Game Test'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-report.xml"
            runDir('run-gametest')
        }
        // the DevScene (see the neoforge project)
        scene {
            client()
            name 'Scene'
            vmArg '-Dironbackpacks.scene=true'
            runDir('run')
        }
    }
}

// Each GameTest run starts from a fresh world.
def gameTestDir = file('run-gametest')
tasks.matching { it.name == 'runGametest' }.configureEach {
    doFirst { new File(gameTestDir, 'world').deleteDir() }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// The release jar on a real Fabric server with Fabric API: runs the GameTests there.
configurations {
    productionMods { transitive = false }
}
dependencies {
    productionMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // not part of the Fabric API bundle; without it the server ignores -Dfabric-api.gametest and just keeps running
    productionMods "net.fabricmc.fabric-api:fabric-gametest-api-v1:${fabric_gametest_version}"
}
def prodDir = file('run-prod')
tasks.register('prodGametest', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    dependsOn jar
    mods.from(jar.archiveFile)
    mods.from(configurations.productionMods)
    jvmArgs.add('-Dfabric-api.gametest')
    runDir = prodDir
    // never hang: the tests take under a minute
    timeout = java.time.Duration.ofMinutes(5)
    doFirst {
        new File(prodDir, 'world').deleteDir()
        prodDir.mkdirs()
        new File(prodDir, 'eula.txt').text = 'eula=true\n'
    }
}
