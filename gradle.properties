# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Project
mod_version=1.0.3
group=gr8pefish.ironbackpacks
java_version=25

# Common
minecraft_version=26.3
minecraft_version_range=[26.3]
mod_name=Iron Backpacks
mod_id=ironbackpacks
license=GPL-3.0
# NeoForm (vanilla Minecraft for the common project); 26.x has no obfuscation and no Parchment
neo_form_version=26.3-1

# NeoForge
neo_version=26.3.0.94
# The oldest NeoForge the jar runs on
neo_version_range=[26.3.0.94,)

# Fabric
fabric_version=0.164.0+26.3
fabric_loader_version=0.19.5

# Optional integration (compile against the API, run the full mod in dev)
jei_version=31.16.0.86
# the fabric-gametest module of this Fabric API (the bundle lacks it)
fabric_gametest_version=4.0.34+3434d6d95d
